<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retro Weather</title>
<style>
:root{--navy:#0a1560;--royal:#1f3fc4;--sky:#5a8cff;--gold:#ffd23a;--white:#f4f6ff;--plum:#3b1a78}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#050a30;color:var(--white);font-family:"Star4000","Trebuchet MS",Verdana,sans-serif;font-weight:700;display:flex;justify-content:center;align-items:center}
.tv{width:min(100vw,960px);min-height:min(100vh,620px);display:flex;flex-direction:column;background:linear-gradient(180deg,var(--royal) 0%,var(--navy) 62%,var(--plum) 100%);border:3px solid #9fb4ff;position:relative;overflow:hidden}
.tv:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:linear-gradient(90deg,var(--navy),var(--royal));border-bottom:3px solid var(--gold)}
.ttl{font-size:clamp(16px,3.4vw,26px);text-shadow:3px 3px 0 #000;letter-spacing:.02em}
.ttl small{display:block;color:var(--gold);font-size:.6em}
#clock{font-size:clamp(16px,3.2vw,24px);text-shadow:3px 3px 0 #000;text-align:right;color:var(--gold)}
main{flex:1;position:relative;padding:20px}
.screen{display:none;height:100%}
.screen.on{display:block;animation:fade .6s}
@keyframes fade{from{opacity:0}to{opacity:1}}
h2{font-size:clamp(18px,3.6vw,28px);color:var(--gold);text-shadow:3px 3px 0 #000;margin-bottom:14px}
.row{display:flex;justify-content:space-between;gap:12px;font-size:clamp(16px,3.4vw,26px);text-shadow:2px 2px 0 #000;padding:5px 0;border-bottom:1px dotted rgba(255,255,255,.35)}
.big{display:flex;align-items:center;gap:20px;margin-bottom:12px}
.big .t{font-size:clamp(52px,14vw,110px);line-height:1;text-shadow:4px 4px 0 #000}
.big .i{font-size:clamp(48px,11vw,84px)}
.big .c{font-size:clamp(18px,3.8vw,30px);text-shadow:3px 3px 0 #000}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:rgba(5,10,60,.6);border:2px solid var(--sky);padding:10px;text-align:center;text-shadow:2px 2px 0 #000;font-size:clamp(13px,2.6vw,20px)}
.card b{display:block;color:var(--gold)}
.card .i{font-size:clamp(30px,7vw,52px);margin:4px 0}
.card .t{font-size:clamp(22px,5vw,36px)}
.msg{font-size:clamp(16px,3vw,22px);text-shadow:2px 2px 0 #000;line-height:1.5}
.ticker{background:#000;border-top:3px solid var(--gold);overflow:hidden;white-space:nowrap;padding:8px 0;color:var(--white);font-size:clamp(14px,2.6vw,20px)}
.ticker span{display:inline-block;padding-left:100%;animation:crawl 45s linear infinite}
@keyframes crawl{to{transform:translateX(-100%)}}
.bar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--navy);border-top:2px solid var(--sky);font-size:14px;z-index:2;position:relative}
.bar button{font:inherit;color:var(--navy);background:var(--gold);border:0;padding:8px 14px;cursor:pointer;box-shadow:2px 2px 0 #000}
.bar button:focus-visible,.bar input:focus-visible{outline:3px solid #fff}
.bar input{accent-color:var(--gold);flex:1;max-width:200px}
.bar .n{margin-left:auto;font-size:12px;opacity:.8;text-align:right}
@font-face{font-family:"Star4000";src:local("Star4000"),url("fonts/Star4000.woff2") format("woff2");font-display:swap}
.i svg{display:block;width:1em;height:1em;filter:drop-shadow(2px 2px 0 #000);shape-rendering:geometricPrecision}
.bar{flex-wrap:wrap}
#q,#trk{background:#000;color:#fff;border:2px solid var(--sky);padding:7px;font:inherit;max-width:190px;min-width:100px}
#sf{display:flex;gap:6px}
.ticker.alert{background:#a00000}
.hr{display:grid;grid-template-columns:1fr .7fr .8fr .8fr 1.6fr;align-items:center;font-size:clamp(13px,2.7vw,21px);text-shadow:2px 2px 0 #000;padding:1px 0;border-bottom:1px dotted rgba(255,255,255,.3)}
.hr.h{color:var(--gold)}.hr .i{font-size:clamp(24px,5vw,34px)}
@media(prefers-reduced-motion:reduce){.ticker span{animation:none;padding-left:8px}.screen.on{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<radialGradient id="gSun" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fffbb0"/><stop offset=".55" stop-color="#ffd42a"/><stop offset="1" stop-color="#ff9a00"/></radialGradient>
<linearGradient id="gMoon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffbe0"/><stop offset="1" stop-color="#e2c65a"/></linearGradient>
<linearGradient id="gCl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#c6d3f5"/><stop offset="1" stop-color="#8296cf"/></linearGradient>
<linearGradient id="gDk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b4bad0"/><stop offset="1" stop-color="#525a80"/></linearGradient>
</defs></svg>
<div class="tv">
<header>
  <div class="ttl">Retro Weather<small id="loc">Locating…</small></div>
  <div id="clock"></div>
</header>
<main>
  <section class="screen on" id="s0"><h2>Current Conditions</h2><div id="cur" class="msg">Requesting your location…</div></section>
  <section class="screen" id="s1"><h2>Extended Forecast</h2><div id="ext" class="grid"></div></section>
  <section class="screen" id="s2"><h2>Hour by Hour (1/3)</h2><div id="hrs"></div></section>
  <section class="screen" id="s3"><h2>Hour by Hour (2/3)</h2><div id="hrs2"></div></section>
  <section class="screen" id="s4"><h2>Hour by Hour (3/3)</h2><div id="hrs3"></div></section>
</main>
<div class="ticker"><span id="tick">Welcome. Allow location access to see your local forecast.</span></div>
<div class="bar">
  <button id="play" aria-pressed="false">▶ Play music</button>
  <button id="mute" aria-pressed="false">Mute</button>
  <label>Volume <input id="vol" type="range" min="0" max="100" value="60"></label>
  <form id="sf"><input id="q" type="text" placeholder="City or ZIP" aria-label="City or ZIP"><button>Go</button></form>
  <select id="trk" aria-label="Music style"><option value="m">Mix of all five</option><option value="0">Bright groove (Rippingtons style)</option><option value="1">Open skies (Pat Metheny Group style)</option><option value="2">Rhodes funk (Jeff Lorber style)</option><option value="3">Soulful piano (Joe Sample style)</option><option value="4">Cinematic (Dave Grusin style)</option></select>
  <div class="n">Data: National Weather Service (NOAA)<br>Music: original, jazz-fusion inspired<br><span id="upd"></span></div>
</div>
</div>

<script>
/* ---------- Clock ---------- */
const $=id=>document.getElementById(id);
setInterval(()=>{const d=new Date();$('clock').innerHTML=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'<br>'+d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})},1000);

/* ---------- Screen rotation (like "Local on the 8s") ---------- */
let cur=0;const SCREENS=5;
setInterval(()=>{$('s'+cur).classList.remove('on');cur=(cur+1)%SCREENS;$('s'+cur).classList.add('on')},12000);

/* ---------- NOAA (api.weather.gov) ---------- */
const CLP='M20 48C11 48 8 38 15 34C14 26 23 21 29 26C33 17 47 19 48 29C57 29 59 44 50 48Z';
const cloud=(x,y,sc,f='gCl')=>`<g transform="translate(${x} ${y}) scale(${sc})"><path d="${CLP}" fill="url(#${f})" stroke="#3d4f8a" stroke-width="1.6" stroke-linejoin="round"/><path d="M19 40C20 32 27 28 33 30" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".8"/></g>`;
const sun=(x,y,sc)=>`<g transform="translate(${x} ${y}) scale(${sc})">${[...Array(8)].map((_,i)=>`<line x1="32" y1="6" x2="32" y2="15" transform="rotate(${i*45} 32 32)" stroke="#ff9d00" stroke-width="4" stroke-linecap="round"/>`).join('')}<circle cx="32" cy="32" r="12" fill="url(#gSun)" stroke="#e07800" stroke-width="1.5"/></g>`;
const moon=(x,y,sc)=>`<g transform="translate(${x} ${y}) scale(${sc})"><path d="M38 8A24 24 0 1 0 56 40A19 19 0 0 1 38 8Z" fill="url(#gMoon)" stroke="#b59a3a" stroke-width="1.5"/></g>`;
const IC={
 sun:()=>sun(0,0,1),moon:()=>moon(0,0,1),
 part:d=>(d?sun(-6,-8,.75):moon(-6,-8,.7))+cloud(4,6,.9),
 cloud:()=>cloud(0,2,1),
 rain:()=>cloud(0,-8,1)+[[22,46],[32,49],[42,46]].map(([x,y])=>`<path d="M${x} ${y}l-3 9" stroke="#3d8bff" stroke-width="3.2" stroke-linecap="round"/>`).join(''),
 snow:()=>cloud(0,-8,1)+[[22,51],[32,55],[42,51]].map(([x,y])=>`<path d="M-4 0H4M0-4V4M-3-3L3 3M-3 3L3-3" stroke="#fff" stroke-width="1.7" stroke-linecap="round" transform="translate(${x} ${y})"/>`).join(''),
 storm:()=>cloud(0,-6,1,'gDk')+'<polygon points="35,38 25,53 32,53 28,64 43,46 35,46 41,38" fill="#ffe14a" stroke="#e08a00" stroke-width="1.4" stroke-linejoin="round"/>',
 fog:()=>cloud(0,-6,1)+'<path d="M12 46H52M16 52H48M12 58H52" stroke="#dbe4ff" stroke-width="3" stroke-linecap="round"/>'};
const icon=(t,d)=>{t=(t||'').toLowerCase();if(d===undefined){const h=new Date().getHours();d=h>=6&&h<20}
 const k=/thunder/.test(t)?'storm':/snow|flurr|sleet|ice/.test(t)?'snow':/rain|shower|drizzle/.test(t)?'rain':/fog|haze|smoke/.test(t)?'fog':/partly|mostly sunny|mostly clear|few/.test(t)?'part':/cloud|overcast/.test(t)?'cloud':/clear|sunny|fair/.test(t)?(d?'sun':'moon'):'cloud';
 return `<svg viewBox="0 0 64 64" aria-hidden="true">${IC[k](d)}</svg>`};
const dir=d=>d==null?'':['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(d/22.5)%16];
const jget=async u=>{const r=await fetch(u,{headers:{Accept:'application/geo+json'}});if(!r.ok)throw new Error(r.status);return r.json()};
const v=x=>x&&x.value!=null?x.value:null;

async function load(lat,lon){
 try{
  const pt=(await jget(`https://api.weather.gov/points/${lat.toFixed(4)},${lon.toFixed(4)}`)).properties;
  const rl=pt.relativeLocation.properties;$('loc').textContent=`${rl.city}, ${rl.state}`;
  const [fc,hr,st]=await Promise.all([jget(pt.forecast),jget(pt.forecastHourly),jget(pt.observationStations)]);
  const P=fc.properties.periods;
  // Extended forecast
  $('ext').innerHTML=P.slice(0,6).map(p=>`<div class="card"><b>${p.name}</b><div class="i">${icon(p.shortForecast,p.isDaytime)}</div><div class="t">${p.temperature}°</div>${p.shortForecast}</div>`).join('');
  // Hourly
  const hp=hr.properties.periods.slice(0,24),
   H=a=>'<div class="hr h"><span>Time</span><span></span><span>Temp</span><span>Rain</span><span>Wind</span></div>'+a.map(p=>`<div class="hr"><span>${new Date(p.startTime).toLocaleTimeString([],{hour:'numeric'})}</span><span class="i">${icon(p.shortForecast,p.isDaytime)}</span><span>${p.temperature}°</span><span>${v(p.probabilityOfPrecipitation)??0}%</span><span>${p.windDirection} ${p.windSpeed}</span></div>`).join('');
  ['hrs','hrs2','hrs3'].forEach((id,i)=>$(id).innerHTML=H(hp.slice(i*8,i*8+8)));
  $('tick').textContent=P[0].name+': '+P[0].detailedForecast+'   •   '+P[1].name+': '+P[1].detailedForecast;
  try{const al=(await jget(`https://api.weather.gov/alerts/active?point=${lat.toFixed(4)},${lon.toFixed(4)}`)).features;
   document.querySelector('.ticker').classList.toggle('alert',al.length>0);
   if(al.length)$('tick').textContent=al.map(a=>'⚠ '+a.properties.event.toUpperCase()+': '+(a.properties.headline||'')).join('   •   ')+'   •   '+$('tick').textContent}catch(e){}
  // Current observation (first station that reports a temperature)
  let o=null;
  for(const s of st.features.slice(0,4)){try{const r=(await jget(s.id+'/observations/latest')).properties;if(v(r.temperature)!=null){o=r;o.sid=s.properties.stationIdentifier;break}}catch(e){}}
  if(o){
   const f=c=>Math.round(c*9/5+32),t=v(o.temperature),w=v(o.windSpeed),h=v(o.relativeHumidity),b=v(o.barometricPressure),vi=v(o.visibility);
   $('cur').className='';
   $('cur').innerHTML=`<div class="big"><div class="i">${icon(o.textDescription)}</div><div class="t">${f(t)}°</div><div class="c">${o.textDescription||''}</div></div>
    <div class="row"><span>Humidity</span><span>${h!=null?Math.round(h)+'%':'--'}</span></div>
    <div class="row"><span>Wind</span><span>${w!=null?dir(v(o.windDirection))+' '+Math.round(w*0.621371)+' mph':'Calm'}</span></div>
    <div class="row"><span>Pressure</span><span>${b!=null?(b*0.0002953).toFixed(2)+' in':'--'}</span></div>
    <div class="row"><span>Visibility</span><span>${vi!=null?Math.round(vi*0.000621371)+' mi':'--'}</span></div>
    <div class="row"><span>Station</span><span>${o.sid}</span></div>`;
  }else{$('cur').textContent='Current observations are unavailable. Forecast shown on the next screens.'}
  $('upd').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
 }catch(e){
  $('cur').textContent='Could not load NOAA data ('+e.message+'). NOAA covers US locations only; the page refreshes automatically.';
 }
}
let rt;
function go(a,b){try{localStorage.setItem('rw',JSON.stringify([a,b]))}catch(e){}clearInterval(rt);load(a,b);rt=setInterval(()=>load(a,b),600000)}
function saved(){try{const c=JSON.parse(localStorage.getItem('rw'));if(c){go(c[0],c[1]);return true}}catch(e){}return false}
function start(){
 const ask=()=>{$('loc').textContent='Search a location';$('cur').textContent='Enter a US city or ZIP code below to see your forecast.'};
 if(!navigator.geolocation){saved()||ask();return}
 navigator.geolocation.getCurrentPosition(p=>go(p.coords.latitude,p.coords.longitude),()=>{saved()||ask()},{timeout:15000});
}
$('sf').onsubmit=async e=>{e.preventDefault();const q=$('q').value.split(',')[0].trim();if(!q)return;$('cur').textContent='Searching…';
 try{const r=await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&format=json&name='+encodeURIComponent(q))).json();
  if(!r.results)throw 0;go(r.results[0].latitude,r.results[0].longitude)}
 catch(x){$('cur').textContent='No match for "'+q+'". Try a US city name or ZIP code.'}};
start();

/* ---------- Jazz-fusion engine: synthesized instruments, real chord voicings, reverb ---------- */
const Z='0'.repeat(16),R=n=>Math.floor(Math.random()*n),rr=(a,b)=>a+Math.random()*(b-a),mf=m=>440*Math.pow(2,(m-69)/12);
// v = voicing stack, m = melody notes, c = chord tones for strong beats (all offsets from chord root)
const Q={maj9:{v:[11,4,7,2],m:[0,2,4,7,9,11],c:[4,7,11,2]},m9:{v:[10,3,7,2],m:[0,2,3,5,7,10],c:[3,7,10,2]},dom13:{v:[10,4,9,2],m:[0,2,4,7,9,10],c:[4,10,9,2]},lyd:{v:[4,11,2,6],m:[0,2,4,6,7,11],c:[4,6,11,2]},six9:{v:[4,9,2,7],m:[0,2,4,7,9],c:[4,9,2,7]}};
const SONGS=[
 {bpm:104,sw:.1,ch:[[0,'maj9'],[9,'m9'],[5,'lyd'],[7,'dom13']],bass:'r..r..o.r.f..o.r',comp:'0010010010010010',ce:'ep',le:'sax',pad:0,k:'1000001000100010',s:'0000100200001002',h:'1111111111111111',r:Z,lo:69,hi:88},
 {bpm:92,sw:0,ch:[[0,'lyd'],[9,'m9'],[5,'maj9'],[2,'six9']],bass:'r.......f...o...',comp:'1010101010101010',arp:1,ce:'ep',le:'gtr',pad:1,k:'1000000000100000',s:'0000000000001000',h:Z,r:'1010101010101010',lo:67,hi:86},
 {bpm:98,sw:.16,ch:[[0,'m9'],[5,'dom13'],[10,'maj9'],[7,'m9']],bass:'r.r..ro.r..fr.o.',comp:'0100101001001010',ce:'ep',le:'ep',pad:0,k:'1000001100100010',s:'0000100200001001',h:'1111111111111111',r:Z,lo:66,hi:86},
 {bpm:88,sw:.24,ch:[[0,'maj9'],[9,'m9'],[2,'m9'],[7,'dom13']],bass:'r.....f.r.o...f.',comp:'1000100100101000',ce:'piano',le:'piano',pad:0,k:'1000000010100000',s:'0000100000001000',h:'1010101010101010',r:Z,lo:67,hi:86},
 {bpm:76,sw:.08,ch:[[0,'maj9'],[5,'lyd'],[4,'m9'],[7,'dom13']],bass:'r.......f...r...',comp:'1010101010101010',arp:1,ce:'piano',le:'piano',pad:1,k:'1000000000100000',s:'0000000000001000',h:Z,r:'1010101010101010',lo:64,hi:86}];
const RH=[[[0,3],[3,3],[6,2],[8,6]],[[2,2],[4,4],[8,3],[11,2],[13,3]],[[0,2],[2,2],[4,2],[6,6],[12,4]],[[3,3],[6,3],[10,2],[12,4]],[[0,6],[8,2],[10,2],[12,4]],[[1,2],[3,2],[6,4],[10,6]],[]],ARP=[0,1,2,3,2,3,1,2];
/* Remake the mixes on every page load: new key, chord start, tempo and groove details */
{const mut=p=>p===Z?p:[...p].map((c,i)=>i&&Math.random()<.1?(c==='0'?'1':'0'):c).join('');
 SONGS.forEach(y=>{y.T=R(12);y.bpm+=R(11)-5;const r=R(4);y.ch=[...y.ch.slice(r),...y.ch.slice(0,r)];y.k=mut(y.k);if(!y.arp)y.comp=mut(y.comp)})}
let ac,comp,master,conv,echIn,dl,nb,timer,playing=false,muted=false,mix=true,cur=R(5),step=0,nextT=0,sty,chs=[],cp=76,ph={},lastR=null;

function setSong(i){cur=i;sty=SONGS[i];let pa=64;
 chs=sty.ch.map(([d,q])=>{const pc=(sty.T+d)%12;let best,bd=1e9;
  for(let f=50;f<=60;f++){const a=[];let p=f-2;for(const o of Q[q].v){let m=p+2;while(m%12!==(pc+o)%12)m++;a.push(m);p=m}
   const sc=Math.abs(a.reduce((x,y)=>x+y)/4-pa)+(a[3]>80?20:0);if(sc<bd){bd=sc;best=a}}
  pa=best.reduce((x,y)=>x+y)/4;return{pc,q,voi:best,b:36+pc}});
 if(dl)dl.delayTime.value=60/sty.bpm*.75}

/* --- audio plumbing --- */
function out(n,wet=.15,pan=0,ech=0){const p=ac.createStereoPanner();p.pan.value=pan;n.connect(p);p.connect(comp);
 const w=ac.createGain();w.gain.value=wet;p.connect(w);w.connect(conv);
 if(ech){const e=ac.createGain();e.gain.value=ech;p.connect(e);e.connect(echIn)}}
const env=(g,t,a,pk,d,h=0)=>{g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(pk,t+a);g.gain.setValueAtTime(pk,t+a+h);g.gain.exponentialRampToValueAtTime(.0001,t+a+h+d)};
const O=(f,ty,t,d)=>{const o=ac.createOscillator();o.type=ty;o.frequency.value=f;o.start(t);o.stop(t+d+.1);return o};
function noise(t,d,ty,fr,v,q=1,wet=0){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nb;f.type=ty;f.frequency.value=fr;f.Q.value=q;
 s.connect(f);f.connect(g);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.start(t,Math.random()*1.5,d+.05);out(g,wet)}

/* --- instruments --- */
function piano(m,t,v,d){const f=mf(m),g=ac.createGain(),lp=ac.createBiquadFilter(),D=Math.max(d,1.6)*(1.25-m/150);lp.frequency.value=900+v*5000;lp.connect(g);
 for(let k=1;k<=6;k++){const o=O(f*k*Math.sqrt(1+.0005*k*k),'sine',t,D),pg=ac.createGain();env(pg,t,.003,v*.2/Math.pow(k,1.1),D/(1+.7*(k-1)));o.connect(pg);pg.connect(lp)}
 noise(t,.03,'lowpass',2200,v*.05,1,.05);out(g,.22,rr(-.25,.25))}
function ep(m,t,v,d){const f=mf(m),D=Math.max(d,1.4),c=O(f,'sine',t,D),md=O(f,'sine',t,D),mg=ac.createGain(),g=ac.createGain();
 mg.gain.setValueAtTime(f*(1+v*2.2),t);mg.gain.exponentialRampToValueAtTime(f*.15,t+.5);md.connect(mg);mg.connect(c.frequency);
 env(g,t,.003,v*.2,D);c.connect(g);const b=O(f*2,'sine',t,.3),bg=ac.createGain();env(bg,t,.002,v*.05,.25);b.connect(bg);bg.connect(g);out(g,.25,rr(-.3,.3))}
function bass(m,t,v,d){const f=mf(m),o=O(f,'triangle',t,d),o2=O(f,'sine',t,d),lp=ac.createBiquadFilter(),g=ac.createGain();
 lp.frequency.setValueAtTime(900,t);lp.frequency.exponentialRampToValueAtTime(260,t+.2);o.connect(lp);lp.connect(g);o2.connect(g);env(g,t,.008,v*.3,d);out(g,.04)}
function sax(m,t,v,d){const f=mf(m),g=ac.createGain(),fl=ac.createBiquadFilter(),fm=ac.createBiquadFilter(),lfo=O(5.3,'sine',t,d),lg=ac.createGain();
 fl.frequency.value=2200;fm.type='peaking';fm.frequency.value=1200;fm.gain.value=7;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(14,t+d*.7);lfo.connect(lg);
 [['sawtooth',1,.6],['square',1.004,.2]].forEach(([ty,r,w])=>{const o=O(f*r,ty,t,d),og=ac.createGain();o.detune.setValueAtTime(-35,t);o.detune.linearRampToValueAtTime(0,t+.07);lg.connect(o.detune);og.gain.value=w;o.connect(og);og.connect(fl)});
 fl.connect(fm);fm.connect(g);env(g,t,.06,v*.13,d*.4,d*.6);noise(t,.15,'bandpass',3000,v*.02);out(g,.3,.15,.25)}
function gtr(m,t,v,d){const f=mf(m),g=ac.createGain(),lp=ac.createBiquadFilter();lp.frequency.setValueAtTime(3500,t);lp.frequency.exponentialRampToValueAtTime(1200,t+d);
 [['triangle',0,.8],['sawtooth',7,.22]].forEach(([ty,dt,w])=>{const o=O(f,ty,t,d),og=ac.createGain();o.detune.value=dt;og.gain.value=w;o.connect(og);og.connect(lp)});
 lp.connect(g);env(g,t,.02,v*.13,d*.3,d*.7);out(g,.35,-.1,.4)}
function pad(m,t,d){const f=mf(m),g=ac.createGain(),lp=ac.createBiquadFilter();lp.frequency.value=1000;
 [-9,0,9].forEach(dt=>{const o=O(f,'sawtooth',t,d+1.5);o.detune.value=dt;o.connect(lp)});lp.connect(g);env(g,t,.9,.014,1.5,.8);out(g,.4,rr(-.4,.4))}

/* --- drums --- */
function kick(t,v){const o=O(140,'sine',t,.3),g=ac.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(48,t+.1);env(g,t,.002,v*.5,.28);o.connect(g);out(g,0);noise(t,.02,'highpass',2500,v*.05)}
function snare(t,v){noise(t,.17,'bandpass',2200,v*.26,.7,.12);const o=O(220,'triangle',t,.12),g=ac.createGain();o.frequency.exponentialRampToValueAtTime(170,t+.08);env(g,t,.001,v*.11,.1);o.connect(g);out(g,.1)}
const hat=(t,v)=>noise(t,.045,'highpass',8500,v*.08,.8,.05),ride=(t,v)=>noise(t,.4,'bandpass',7800,v*.07,1.2,.15);

/* --- ensemble --- */
function pick(c,strong){const set=Q[c.q][strong?'c':'m'],mid=(sty.lo+sty.hi)/2,a=[];
 for(let m=sty.lo;m<=sty.hi;m++)if(set.includes(((m-c.pc)%12+12)%12))a.push([Math.abs(m-cp)+Math.random()*3.5+Math.abs(m-mid)*.12+(m===cp?4:0),m]);
 a.sort((x,y)=>x[0]-y[0]);return cp=a[0][1]}
function sched(){while(nextT<ac.currentTime+.8){
 if(mix&&step>0&&step%256===0)setSong((cur+1)%5);
 const ST=60/sty.bpm/4,s=step%16,bar=Math.floor(step/16),c=chs[bar%4],t=nextT+(s%2?ST*sty.sw:0),hu=()=>rr(0,.012);
 if(s===0){if(sty.pad)c.voi.forEach(m=>pad(m,t,ST*16));ph={};if(bar%2===0||!lastR)lastR=RH[R(RH.length)];lastR.forEach(([a,l])=>ph[a]=l)}
 const bc=sty.bass[s];if(bc!=='.')bass(c.b+(bc==='o'?12:bc==='f'?7:0),t,rr(.75,1),ST*2.6);
 if(sty.comp[s]==='1'){const v=(s%4?.55:.75)*rr(.85,1.1),I=sty.ce==='ep'?ep:piano;
  if(sty.arp){const i=ARP[s>>1];I(c.voi[i]+(i===3?12:0),t+hu(),v,1.4)}else c.voi.forEach((m,i)=>I(m,t+i*.011+hu(),v*rr(.8,1),1.4))}
 if(sty.k[s]==='1')kick(t,rr(.85,1));
 if(sty.s[s]!=='0')snare(t,sty.s[s]==='2'?.3:.85);
 else if(bar%4===3&&s>=14&&sty.s!==Z)snare(t,.3+.15*(s-14));
 if(sty.h[s]==='1')hat(t,(s%4?s%2?.35:.6:.9)*rr(.85,1.1));
 if(sty.r[s]==='1')ride(t,(s%4?.55:.9)*rr(.85,1.1));
 if(ph[s]){const l=ph[s],n=pick(c,s%4===0),v=rr(.65,.95),L={sax,gtr,ep,piano}[sty.le];L(n,t+hu(),L===ep||L===piano?v*1.3:v,Math.max(l*ST*.95,.25))}
 nextT+=ST;step++}}

function init(){ac=new (window.AudioContext||window.webkitAudioContext)();
 comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3;master=ac.createGain();comp.connect(master);master.connect(ac.destination);
 nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);{const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 conv=ac.createConvolver();const L=Math.floor(ac.sampleRate*2.4),ib=ac.createBuffer(2,L,ac.sampleRate);
 for(let c=0;c<2;c++){const d=ib.getChannelData(c);let lp=0;for(let i=0;i<L;i++){lp+=((Math.random()*2-1)*Math.pow(1-i/L,2.8)-lp)*(.25+.5*(1-i/L));d[i]=lp}}
 conv.buffer=ib;const rg=ac.createGain();rg.gain.value=.9;conv.connect(rg);rg.connect(comp);
 echIn=ac.createGain();dl=ac.createDelay(2);const fb=ac.createGain(),lpE=ac.createBiquadFilter();fb.gain.value=.36;lpE.frequency.value=2600;
 echIn.connect(dl);dl.connect(lpE);lpE.connect(fb);fb.connect(dl);lpE.connect(comp);lpE.connect(conv);setSong(cur);setVol()}
function setVol(){if(master)master.gain.setTargetAtTime(muted?0:$('vol').value/100*.9,ac.currentTime,.05)}
setSong(cur);
$('play').onclick=async()=>{
 if(!ac)init();
 if(!playing){await ac.resume();nextT=ac.currentTime+.15;timer=setInterval(sched,200);playing=true;$('play').textContent='❚❚ Pause music'}
 else{clearInterval(timer);ac.suspend();playing=false;$('play').textContent='▶ Play music'}
 $('play').setAttribute('aria-pressed',playing)};
$('trk').onchange=()=>{const v=$('trk').value;mix=v==='m';if(!mix)cur=+v;step=0;lastR=null;setSong(cur)};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'Unmute':'Mute';$('mute').setAttribute('aria-pressed',muted);setVol()};
$('vol').oninput=setVol;
</script>
