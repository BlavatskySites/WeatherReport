<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retro Weather</title>
<style>
:root{--navy:#0a1560;--royal:#1f3fc4;--sky:#5a8cff;--gold:#ffd23a;--white:#f4f6ff;--plum:#3b1a78}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;max-width:100vw}
@supports(height:100dvh){html,body{height:100dvh}}
body{background:#050a30;color:var(--white);font-family:"Star4000","Trebuchet MS",Verdana,sans-serif;font-weight:700;display:flex;flex-direction:column;text-shadow:-1px 0 rgba(255,40,80,.5),1px 0 rgba(0,210,255,.5)}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;background:#000;width:100%}
/* the "TV": a container whose size follows the device; everything inside sizes itself from it (cq units) and flexes to fill it */
.tv{position:absolute;left:0;top:0;width:640px;height:480px;transform-origin:0 0;container-type:size;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,var(--royal) 0%,var(--navy) 62%,var(--plum) 100%);border:6px solid #1a1f3a;border-radius:26px;box-shadow:inset 0 0 90px rgba(0,0,0,.75),0 0 30px rgba(90,140,255,.35);filter:contrast(1.12) saturate(1.2);animation:flick 4s infinite}
.tv:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 2px,transparent 2px 4px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6))}
header{flex:none;display:flex;justify-content:space-between;align-items:center;gap:2cqmin;padding:1.6cqmin 3cqmin;background:linear-gradient(90deg,var(--navy),var(--royal));border-bottom:3px solid var(--gold)}
.ttl{font-size:5.5cqmin;text-shadow:3px 3px 0 #000}
.ttl small{display:block;color:var(--gold);font-size:.62em}
#clock{font-size:4.5cqmin;text-align:right;color:var(--gold);text-shadow:3px 3px 0 #000}
main{flex:1;min-height:0;position:relative;padding:2.4cqmin 3cqmin;overflow:hidden}
.screen{display:none;height:100%;flex-direction:column;gap:1.6cqmin}
.screen.on{display:flex;animation:fade .6s}
h2{flex:none;font-size:7cqmin;color:var(--gold);text-shadow:3px 3px 0 #000}
.msg{font-size:4.5cqmin;line-height:1.5;text-shadow:2px 2px 0 #000}
#cur,#hrs,#hrs2,#hrs3,#wc1,#wc2,#ext,#nb,#al{flex:1;min-height:0}
/* current conditions: hero on top, detail rows share the remaining height evenly */
#cur{display:flex;flex-direction:column;gap:1.2cqmin}
.big{flex:none;display:flex;align-items:center;gap:3cqmin}
.big .t{font-size:21cqmin;line-height:1;text-shadow:4px 4px 0 #000}
.big .i{font-size:18cqmin}
.big .c{font-size:6cqmin;text-shadow:3px 3px 0 #000}
.row{flex:1;min-height:0;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:5cqmin;text-shadow:2px 2px 0 #000;border-bottom:1px dotted rgba(255,255,255,.35)}
/* cards (6-day forecast + nearby cities) */
.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:1.6cqmin}
#ext,#nb .grid{height:100%}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqmin;min-height:0;background:rgba(5,10,60,.6);border:2px solid var(--sky);padding:1.4cqmin;text-align:center;text-shadow:2px 2px 0 #000;font-size:3.8cqmin}
.card b{color:var(--gold);font-size:4.4cqmin}
.card .i{font-size:13cqmin}
.card .t{font-size:8.5cqmin}
.card .cl{display:flex;flex-direction:column;align-items:center;gap:.4cqmin}
.card .d{font-size:3.6cqmin;line-height:1.55}
/* hourly + world-city tables: rows share the height evenly */
#hrs,#hrs2,#hrs3,#wc1,#wc2{display:flex;flex-direction:column}
.hr{flex:1;min-height:0;display:grid;grid-template-columns:1fr .7fr .8fr .8fr 1.6fr;align-items:center;gap:1cqmin;font-size:4.6cqmin;text-shadow:2px 2px 0 #000;border-bottom:1px dotted rgba(255,255,255,.3)}
.hr.h{flex:none;color:var(--gold);font-size:3.2cqmin;padding-bottom:.6cqmin}
.hr .i{font-size:8.5cqmin}
.hr.c{grid-template-columns:1.6fr .6fr .7fr 1.4fr}
.hr>span:nth-child(-n+4){white-space:nowrap}
/* portrait: stack things instead of cramming */
@container (max-aspect-ratio:1/1){#ext{grid-template-columns:repeat(2,1fr)}#nb .grid{grid-template-columns:1fr}}
/* alerts */
.screen.alert h2{color:#fff;background:#c00000;padding:.6cqmin 1.6cqmin;animation:blink 1s steps(2) infinite}
#al{overflow:hidden;font-size:4.2cqmin;line-height:1.4}
/* maps */
.mapw{flex:1;min-height:0;display:flex;flex-direction:column}
.stack{position:relative;flex:1;min-height:0;border:4px solid var(--sky);background:#000;overflow:hidden;filter:contrast(1.2) saturate(1.3)}
.stack img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.stack img:nth-child(3){filter:brightness(1.6) drop-shadow(0 0 2px #000)}
.stack:after{content:"";position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;border:3px solid #ff2a2a;border-radius:50%;box-shadow:0 0 0 2px #000,0 0 8px #000}
.you{position:absolute;left:50%;top:50%;transform:translate(-50%,20px);color:#fff;font-size:18px;font-weight:700;text-shadow:2px 2px 0 #000,-1px -1px 0 #000;white-space:nowrap;z-index:2}
.cap{flex:none;font-size:3.2cqmin;text-align:center;color:var(--gold);text-shadow:1px 1px 0 #000;margin-top:4px}
.ticker{flex:none;background:#000;border-top:3px solid var(--gold);overflow:hidden;white-space:nowrap;padding:1.2cqmin 0;font-size:4.2cqmin}
.ticker span{display:inline-block;padding-left:100%;animation:crawl 45s linear infinite}
.ticker.alert{background:#a00000}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes crawl{to{transform:translateX(-100%)}}
@keyframes blink{50%{background:#600}}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.965}52%{opacity:1}}
/* top bar: ZIP + music (90s bevels) and footer NEXT */
.top,.top *{text-shadow:none}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;max-width:100vw;padding:5px 8px;background:var(--navy);border-bottom:2px solid var(--sky);font-size:12px}
.top form{display:flex;flex:1 1 100%;min-width:0;gap:6px}
.top #q{flex:1;min-width:0;min-height:34px;padding:8px 10px;font:17px Tahoma,Verdana,Arial,sans-serif;background:#fff;color:#000;border:2px solid;border-color:#808080 #fff #fff #808080;box-shadow:inset 1px 1px #404040;border-radius:0}
.top #q::placeholder{color:#707070}
.top button,button#nx{background:#c0c0c0;color:#000;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:inset -1px -1px #808080,inset 1px 1px #dfdfdf;font-family:"MS Sans Serif",Tahoma,Verdana,Arial,sans-serif;font-weight:700;border-radius:0;cursor:pointer}
.top button:active,button#nx:active{background:#b4b4b4;border-color:#404040 #fff #fff #404040;box-shadow:inset 1px 1px #808080,inset -1px -1px #dfdfdf}
.top form button{min-height:34px;padding:0 16px;font-size:15px}
.mus{display:flex;align-items:center;flex:1 1 100%;flex-wrap:wrap;gap:8px}
.mus button{width:42px;height:38px;padding:0;font-size:22px;line-height:1}
.mus input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;flex:1 1 70px;height:30px;margin:0}
.mus input[type=range]::-webkit-slider-runnable-track{height:8px;background:#5a8cff;border-radius:4px}
.mus input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-10px;border-radius:50%;background:#ffd23a;border:2px solid #000}
.mus input[type=range]::-moz-range-track{height:8px;background:#5a8cff;border-radius:4px}
.mus input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#ffd23a;border:2px solid #000}
#np{flex:1 1 100%;font-size:11px;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .n{font-size:10px;opacity:.6;white-space:nowrap}
button#nx{display:flex;align-items:center;justify-content:center;gap:3.75vw;width:100%;height:11.25vh;min-height:42px;padding:0;border-width:3px;font-size:min(5.25vw,25.5px);letter-spacing:.15em}
button#nx svg{height:55%;width:auto;fill:#000080}
@media(prefers-reduced-motion:reduce){.ticker span{animation:none;padding-left:8px}.screen.on,.tv,.screen.alert h2{animation:none}}
.hr.c>span:nth-child(4){white-space:normal}
.fact{flex:1;display:flex;align-items:center;font-size:6cqmin;line-height:1.5;text-shadow:3px 3px 0 #000}
.trivia h2{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:.35em}
.i svg,.ni svg,.xi svg{display:block;width:1em;height:1em;filter:drop-shadow(2px 2px 0 #000);shape-rendering:geometricPrecision}
.i,.ni{line-height:1}
.card{overflow:hidden}
.hr>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.nc{display:grid;min-width:0;min-height:0;overflow:hidden;align-items:center;column-gap:2cqmin;row-gap:.6cqmin;padding:1.4cqmin 2cqmin;background:rgba(5,10,60,.6);border:2px solid var(--sky);text-shadow:2px 2px 0 #000;grid-template-columns:auto 1fr auto;grid-template-areas:"ni nm nt" "ni nw nt" "nd nd nd"}
.nc>b{grid-area:nm;color:var(--gold);font-size:4.6cqmin;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt{grid-area:nt;font-size:9cqmin;line-height:1}
.ni{grid-area:ni;font-size:11cqmin}
.nw{grid-area:nw;font-size:3.8cqmin;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd{grid-area:nd;display:grid;grid-template-columns:1fr 1fr;gap:.4cqmin 2cqmin;font-size:3.5cqmin;line-height:1.3}
.nd span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nb .grid{grid-template-columns:1fr}
@container (min-aspect-ratio:1/1){.nc{grid-template-columns:auto 1.3fr auto 1.7fr;grid-template-areas:"ni nm nt nd" "ni nw nt nd"}.nd{align-self:center}}
.xc{display:grid;min-width:0;min-height:0;overflow:hidden;grid-template-columns:auto 1fr;grid-template-areas:"xi xn" "xi xt" "xf xf";align-items:center;column-gap:2cqmin;row-gap:.8cqmin;padding:1.4cqmin 2cqmin;background:rgba(5,10,60,.6);border:2px solid var(--sky);text-shadow:2px 2px 0 #000}
.xc>b{grid-area:xn;color:var(--gold);font-size:4.2cqmin;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xt{grid-area:xt;font-size:8cqmin;line-height:1}
.xi{grid-area:xi;font-size:12cqmin;line-height:1}
.xf{grid-area:xf;font-size:3.4cqmin;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fact{overflow:hidden;line-height:1.3;font-size:6cqmin}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<radialGradient id="gSun" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fffbb0"/><stop offset=".55" stop-color="#ffd42a"/><stop offset="1" stop-color="#ff9a00"/></radialGradient>
<linearGradient id="gMoon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffbe0"/><stop offset="1" stop-color="#e2c65a"/></linearGradient>
<linearGradient id="gCl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#c6d3f5"/><stop offset="1" stop-color="#8296cf"/></linearGradient>
<linearGradient id="gDk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b4bad0"/><stop offset="1" stop-color="#525a80"/></linearGradient>
</defs></svg>
<div class="top"><form id="sf"><input id="q" type="text" placeholder="ZIP or city" aria-label="ZIP or city"><button>Go</button></form>
<span class="mus"><button id="play" title="Play music">♪</button><button id="rnd" title="Random song">⤮</button><button id="mute" title="Mute">🔈</button><input id="vol" type="range" min="0" max="100" value="50" aria-label="Volume"><span id="np"></span></span>
<span class="n">NOAA <span id="upd"></span> <b>v25</b></span><audio id="aud" preload="none"></audio></div>
<div id="stage"><div class="tv">
<header>
  <div class="ttl">Retro Weather<small id="loc">Locating…</small></div>
  <div id="clock"></div>
</header>
<main>
  <section class="screen on" id="s0"><h2>Current Conditions</h2><div id="cur" class="msg">Requesting your location…</div></section>
  <section class="screen" id="s1"><h2>Extended Forecast</h2><div id="ext" class="grid"></div></section>
  <section class="screen" id="s2"><h2>Hour by Hour (1/3)</h2><div id="hrs"></div></section>
  <section class="screen" id="s3"><h2>Hour by Hour (2/3)</h2><div id="hrs2"></div></section>
  <section class="screen" id="s4"><h2>Hour by Hour (3/3)</h2><div id="hrs3"></div></section>
</main>
<div class="ticker"><span id="tick">Welcome. Allow location access to see your local forecast.</span></div>
</div></div>
<button id="nx" aria-label="Next screen"><svg viewBox="0 0 10 8" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="3" width="6" height="2"/><rect x="6" y="0" width="1" height="8"/><rect x="7" y="1" width="1" height="6"/><rect x="8" y="2" width="1" height="4"/><rect x="9" y="3" width="1" height="2"/></svg><span>NEXT</span></button>
<script>
/* ---------- Clock ---------- */
const $=id=>document.getElementById(id);
setInterval(()=>{const d=new Date();$('clock').innerHTML=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'<br>'+d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})},1000);

/* ---------- Screen rotation (like "Local on the 8s") ---------- */
let cur=0;const WORLD=[['Tokyo',35.68,139.69],['Delhi',28.61,77.21],['Shanghai',31.23,121.47],['São Paulo',-23.55,-46.63],['Mexico City',19.43,-99.13],['Cairo',30.04,31.24],['Mumbai',19.08,72.88],['Beijing',39.9,116.4],['Dhaka',23.81,90.41],['Osaka',34.69,135.5]];
const US=[['Asheville',35.6,-82.55],['Charlotte',35.23,-80.84],['Knoxville',35.96,-83.92],['Atlanta',33.75,-84.39],['Raleigh',35.78,-78.64],['Greenville SC',34.85,-82.4],['Nashville',36.16,-86.78],['Columbia SC',34,-81.03],['Richmond',37.54,-77.44],['Washington DC',38.9,-77.04],['Birmingham',33.52,-86.8],['Louisville',38.25,-85.76],['Charleston SC',32.78,-79.93],['Jacksonville',30.33,-81.66],['Memphis',35.15,-90.05],['Pittsburgh',40.44,-79.99],['Philadelphia',39.95,-75.17],['New York',40.71,-74.01],['Chicago',41.88,-87.63],['Miami',25.76,-80.19],['Houston',29.76,-95.37],['Dallas',32.78,-96.8],['Denver',39.74,-104.99],['Los Angeles',34.05,-118.24],['Seattle',47.61,-122.33],['Phoenix',33.45,-112.07],['Boston',42.36,-71.06]];
const bb=(L,h)=>{const w=h/Math.cos(L[0]*Math.PI/180);return[L[1]-w,L[0]-h,L[1]+w,L[0]+h].map(x=>x.toFixed(4)).join(',')};
const G='https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&STYLES=&SRS=EPSG:4326';
const gibs=(l,B,op)=>G+'&WIDTH='+CW+'&HEIGHT=800&LAYERS='+l+'&BBOX='+B+(op?'&FORMAT=image/jpeg':'&FORMAT=image/png&TRANSPARENT=TRUE');
const dark=B=>'https://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Dark_Gray_Base/MapServer/export?bboxSR=4326&imageSR=4326&size='+CW+',800&format=jpg&f=image&bbox='+B;
const radar=B=>['https://mapservices.weather.noaa.gov/eventdriven/rest/services/radar/radar_base_reflectivity/MapServer/export?dpi=96&transparent=true&format=png32&bboxSR=4326&imageSR=4326&f=image&size='+CW+',800&bbox='+B,
 'https://idpgis.ncep.noaa.gov/arcgis/rest/services/NWS_Observations/radar_base_reflectivity/MapServer/export?dpi=96&transparent=true&format=png32&bboxSR=4326&imageSR=4326&f=image&size='+CW+',800&bbox='+B,
 'https://opengeo.ncep.noaa.gov/geoserver/conus/conus_bref_qcd/ows?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=conus_bref_qcd&STYLES=&FORMAT=image/png&TRANSPARENT=true&SRS=EPSG:4326&WIDTH='+CW+'&HEIGHT=800&BBOX='+B];
const lab=B=>['https://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/export?dpi=96&bboxSR=4326&imageSR=4326&format=png32&transparent=true&f=image&size='+Math.round(CW*.55)+',440&bbox='+B];
const coast=B=>[gibs('Coastlines_15m',B,0)];
const MAPS=[
 {t:'Satellite',h:6,a:(B,S)=>[gibs(S+'_ABI_GeoColor',B,1),gibs('GOES-East_ABI_GeoColor',B,1)],b:coast,c:lab},
 {t:'Regional Radar (Rain)',h:9,a:B=>[dark(B)],b:radar,c:lab},
 {t:'Local Radar (Rain)',h:3,a:B=>[dark(B)],b:radar,c:lab}];
let LOC=null,RADAR=null,CW=800;
{const e=document.createElement('section');e.className='screen alert skip';e.id='sAL';e.innerHTML='<h2>⚠ EMERGENCY ALERT</h2><div id="al" class="msg"></div>';document.querySelector('main').prepend(e)}
const add=(t,b)=>{const e=document.createElement('section');e.className='screen';e.id='s'+document.querySelectorAll('.screen').length;e.innerHTML='<h2>'+t+'</h2>'+b;document.querySelector('main').appendChild(e)};
MAPS.forEach((m,i)=>add(m.t,'<div class="mapw" data-i="'+i+'"><div class="stack"><img alt=""><img alt=""><img alt=""><div class="you"></div></div><div class="cap"></div></div>'));
add('Nearby Cities','<div id="nb"></div>');add('World Cities (1/2)','<div id="wc1"></div>');add('World Cities (2/2)','<div id="wc2"></div>');add('Did you know?','<div id="fact" class="fact"></div>');document.querySelector('main').lastElementChild.classList.add('trivia');
const WM=c=>c===0?'Clear':c<3?'Partly cloudy':c===3?'Overcast':c<50?'Fog':c<60?'Drizzle':c<70?'Rain':c<80?'Snow':c<90?'Showers':'Thunderstorm';
async function cities(l,id){try{const r=await(await fetch('https://api.open-meteo.com/v1/forecast?current=temperature_2m,weather_code&temperature_unit=fahrenheit&latitude='+l.map(c=>c[1])+'&longitude='+l.map(c=>c[2]))).json(),a=Array.isArray(r)?r:[r];
 $(id).innerHTML=l.map((c,i)=>{const w=WM(a[i].current.weather_code);return '<div class="hr c"><span>'+c[0]+'</span><span class="i">'+icon(w)+'</span><span>'+Math.round(a[i].current.temperature_2m)+'°</span><span>'+w+'</span></div>'}).join('')}catch(e){$(id).textContent='City data unavailable.'}}
async function nearby(l){try{const r=await(await fetch('https://api.open-meteo.com/v1/forecast?current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&wind_speed_unit=mph&forecast_days=1&timezone=auto&latitude='+l.map(c=>c[1])+'&longitude='+l.map(c=>c[2]))).json(),a=Array.isArray(r)?r:[r];
 $('nb').innerHTML='<div class="grid">'+l.map((c,i)=>{const u=a[i].current,d=a[i].daily,w=WM(u.weather_code);return '<div class="nc"><b>'+c[0]+'</b><div class="nt">'+Math.round(u.temperature_2m)+'°</div><div class="ni">'+icon(w)+'</div><div class="nw">'+w+'</div><div class="nd"><span>H'+Math.round(d.temperature_2m_max[0])+'° L'+Math.round(d.temperature_2m_min[0])+'°</span><span>Rain '+(d.precipitation_probability_max[0]??0)+'%</span><span>Wind '+Math.round(u.wind_speed_10m)+' mph</span><span>Hum '+u.relative_humidity_2m+'%</span></div></div>'}).join('')+'</div>'}catch(e){$('nb').textContent='City data unavailable.'}}
const nearest=(a,b)=>US.map(c=>[c,(c[1]-a)**2+((c[2]-b)*Math.cos(a*Math.PI/180))**2]).sort((x,y)=>x[1]-y[1]).slice(0,3).map(x=>x[0]);
function snaps(){const L=LOC||[39.5,-98.5],S=L[1]<-104?'GOES-West':'GOES-East',t='&t='+Math.floor(Date.now()/9e5);
 document.querySelectorAll('.mapw').forEach(w=>{const m=MAPS[w.dataset.i],B=bb(L,m.h),im=(CW=Math.round(800/Math.cos(L[0]*Math.PI/180)),w.querySelectorAll('img')),cap=w.querySelector('.cap');
  cap.textContent=LOC?'Centered on your location (red ring)':'Location not set - showing central US';
  [m.a,m.b,m.c].forEach((f,k)=>{const c=f(B,S);let n=0;im[k].style.opacity=1;im[k].onerror=()=>{if(++n<c.length)im[k].src=c[n]+t;else{im[k].style.opacity=0;if(!k)cap.textContent='Map data unavailable right now'}};im[k].src=c[0]+t})})}
snaps();setInterval(snaps,15*60*1000);

const FACTS=['Lightning can heat the air around it to roughly five times the temperature of the surface of the Sun.','The hottest air temperature ever officially recorded is 134°F (56.7°C), at Death Valley, California, on July 10, 1913.','The coldest temperature ever recorded on Earth is -128.6°F (-89.2°C), at Vostok Station, Antarctica, in 1983.','The heaviest hailstone ever recorded in the U.S. fell in Vivian, South Dakota in 2010. It was 8 inches wide and weighed almost 2 pounds.','Count the seconds between a lightning flash and its thunder, then divide by 5. That is roughly how many miles away the strike was.','Rainbows are really full circles. From the ground, the horizon hides the bottom part so you only see an arc.','Petrichor is the name for the earthy smell that rises when rain hits dry ground.','Fog is simply a cloud that touches the ground.','A typical fluffy cumulus cloud can weigh more than a million pounds, held up by tiny droplets drifting in rising air.','Snow crystals have six sides because of the way water molecules lock together as they freeze.','The Atlantic hurricane season officially runs from June 1 to November 30.','Tornadoes in the U.S. are rated from EF0 to EF5 on the Enhanced Fujita scale, based on the damage they cause.','The jet stream is a river of fast air high above the ground that can top 200 miles per hour.','Mawsynram, in India, is one of the wettest places on Earth, with roughly 400 inches of rain in a typical year.','The strongest wind gust ever measured away from a tornado was 253 mph on Barrow Island, Australia, during Cyclone Olivia in 1996.','Raindrops fall at about 5 to 20 miles per hour, depending on how big they are.'];
(async()=>{try{const r=await(await fetch('https://factfacts.com/api.php?count=10&category=weather')).json(),a=(r.facts||[r.fact]).map(f=>f&&f.text).filter(t=>t&&/weather|rain|storm|thunder|lightning|tornado|hurricane|snow|wind|cloud|temperature|climate|fog|hail|rainbow|flood|forecast/i.test(t));FACTS.push(...a)}catch(e){}})();
function newFact(){const e=$('fact');if(!e)return;e.textContent=FACTS[Math.floor(Math.random()*FACTS.length)];let lo=14,hi=90;for(let i=0;i<9;i++){const m=(lo+hi)/2;e.style.fontSize=m+'px';if(e.scrollHeight<=e.clientHeight+1&&e.scrollWidth<=e.clientWidth+1)lo=m;else hi=m}e.style.fontSize=lo+'px'}
const scr=()=>[...document.querySelectorAll('.screen')];

 if(al.length&&!emergency.shown){emergency.shown=1;show(scr().indexOf(e));arm()}if(!al.length)emergency.shown=0}
function fit(){const r=$('stage').getBoundingClientRect(),w=Math.floor(r.width),h=Math.floor(r.height);if(!w||!h)return;
 const k=Math.min(w,h)/400,tv=document.querySelector('.tv');tv.style.width=tv.style.minWidth=tv.style.maxWidth=(w/k)+'px';tv.style.height=tv.style.minHeight=(h/k)+'px';tv.style.transform='scale('+k+')'}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,250));if(window.ResizeObserver)new ResizeObserver(fit).observe($('stage'));fit();

/* ---------- NOAA (api.weather.gov) ---------- */
const CLP='M20 48C11 48 8 38 15 34C14 26 23 21 29 26C33 17 47 19 48 29C57 29 59 44 50 48Z';
const cloud=(x,y,sc,f='gCl')=>`<g transform="translate(${x} ${y}) scale(${sc})"><path d="${CLP}" fill="url(#${f})" stroke="#3d4f8a" stroke-width="1.6" stroke-linejoin="round"/><path d="M19 40C20 32 27 28 33 30" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".8"/></g>`;
const sun=(x,y,sc)=>`<g transform="translate(${x} ${y}) scale(${sc})">${[...Array(8)].map((_,i)=>`<line x1="32" y1="6" x2="32" y2="15" transform="rotate(${i*45} 32 32)" stroke="#ff9d00" stroke-width="4" stroke-linecap="round"/>`).join('')}<circle cx="32" cy="32" r="12" fill="url(#gSun)" stroke="#e07800" stroke-width="1.5"/></g>`;
const moon=(x,y,sc)=>`<g transform="translate(${x} ${y}) scale(${sc})"><path d="M38 8A24 24 0 1 0 56 40A19 19 0 0 1 38 8Z" fill="url(#gMoon)" stroke="#b59a3a" stroke-width="1.5"/></g>`;
const IC={
 sun:()=>sun(0,0,1),moon:()=>moon(0,0,1),
 part:d=>(d?sun(-6,-8,.75):moon(-6,-8,.7))+cloud(4,6,.9),
 cloud:()=>cloud(0,2,1),
 rain:()=>cloud(0,-8,1)+[[22,46],[32,49],[42,46]].map(([x,y])=>`<path d="M${x} ${y}l-3 9" stroke="#3d8bff" stroke-width="3.2" stroke-linecap="round"/>`).join(''),
 snow:()=>cloud(0,-8,1)+[[22,51],[32,55],[42,51]].map(([x,y])=>`<path d="M-4 0H4M0-4V4M-3-3L3 3M-3 3L3-3" stroke="#fff" stroke-width="1.7" stroke-linecap="round" transform="translate(${x} ${y})"/>`).join(''),
 storm:()=>cloud(0,-6,1,'gDk')+'<polygon points="35,38 25,53 32,53 28,64 43,46 35,46 41,38" fill="#ffe14a" stroke="#e08a00" stroke-width="1.4" stroke-linejoin="round"/>',
 fog:()=>cloud(0,-6,1)+'<path d="M12 46H52M16 52H48M12 58H52" stroke="#dbe4ff" stroke-width="3" stroke-linecap="round"/>'};
const icon=(t,d)=>{t=(t||'').toLowerCase();if(d===undefined){const h=new Date().getHours();d=h>=6&&h<20}
 const k=/thunder/.test(t)?'storm':/snow|flurr|sleet|ice/.test(t)?'snow':/rain|shower|drizzle/.test(t)?'rain':/fog|haze|smoke/.test(t)?'fog':/partly|mostly sunny|mostly clear|few/.test(t)?'part':/cloud|overcast/.test(t)?'cloud':/clear|sunny|fair/.test(t)?(d?'sun':'moon'):'cloud';
 return `<svg viewBox="0 0 64 64" aria-hidden="true">${IC[k](d)}</svg>`};
const dir=d=>d==null?'':['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(d/22.5)%16];
const jget=async u=>{const r=await fetch(u,{headers:{Accept:'application/geo+json'}});if(!r.ok)throw new Error(r.status);return r.json()};
const v=x=>x&&x.value!=null?x.value:null;

async function load(lat,lon){nearby(nearest(lat,lon));
 try{
  const pt=(await jget(`https://api.weather.gov/points/${lat.toFixed(4)},${lon.toFixed(4)}`)).properties;
  const rl=pt.relativeLocation.properties;if(pt.radarStation&&RADAR!==pt.radarStation){RADAR=pt.radarStation;snaps()}$('loc').textContent=`${rl.city}, ${rl.state}`;document.querySelectorAll('.you').forEach(e=>e.textContent='▲ '+$('loc').textContent);
  const [fc,hr,st]=await Promise.all([jget(pt.forecast),jget(pt.forecastHourly),jget(pt.observationStations)]);
  const P=fc.properties.periods;
  // Extended forecast
  $('ext').innerHTML=P.slice(0,6).map(p=>`<div class="xc"><b>${p.name}</b><div class="xt">${p.temperature}°</div><div class="xi">${icon(p.shortForecast,p.isDaytime)}</div><div class="xf">${p.shortForecast}</div></div>`).join('');
  // Hourly
  const hp=hr.properties.periods.slice(0,18),
   H=a=>'<div class="hr h"><span>Time</span><span></span><span>Temp</span><span>Rain</span><span>Wind</span></div>'+a.map(p=>`<div class="hr"><span>${new Date(p.startTime).toLocaleTimeString([],{hour:'numeric'})}</span><span class="i">${icon(p.shortForecast,p.isDaytime)}</span><span>${p.temperature}°</span><span>${v(p.probabilityOfPrecipitation)??0}%</span><span>${p.windDirection} ${p.windSpeed}</span></div>`).join('');
  ['hrs','hrs2','hrs3'].forEach((id,i)=>$(id).innerHTML=H(hp.slice(i*6,i*6+6)));
  $('tick').textContent=P[0].name+': '+P[0].detailedForecast+'   •   '+P[1].name+': '+P[1].detailedForecast;
  try{const al=(await jget(`https://api.weather.gov/alerts/active?point=${lat.toFixed(4)},${lon.toFixed(4)}`)).features;
   document.querySelector('.ticker').classList.toggle('alert',al.length>0);
   emergency(al);if(al.length)$('tick').textContent=al.map(a=>'⚠ '+a.properties.event.toUpperCase()+': '+(a.properties.headline||'')).join('   •   ')+'   •   '+$('tick').textContent}catch(e){}
  // Current observation (first station that reports a temperature)
  let o=null;
  for(const s of st.features.slice(0,4)){try{const r=(await jget(s.id+'/observations/latest')).properties;if(v(r.temperature)!=null){o=r;o.sid=s.properties.stationIdentifier;break}}catch(e){}}
  if(o){
   const f=c=>Math.round(c*9/5+32),t=v(o.temperature),w=v(o.windSpeed),h=v(o.relativeHumidity),b=v(o.barometricPressure),vi=v(o.visibility);
   $('cur').className='';
   $('cur').innerHTML=`<div class="big"><div class="i">${icon(o.textDescription)}</div><div class="t">${f(t)}°</div><div class="c">${o.textDescription||''}</div></div>
    <div class="row"><span>Humidity</span><span>${h!=null?Math.round(h)+'%':'--'}</span></div>
    <div class="row"><span>Wind</span><span>${w!=null?dir(v(o.windDirection))+' '+Math.round(w*0.621371)+' mph':'Calm'}</span></div>
    <div class="row"><span>Pressure</span><span>${b!=null?(b*0.0002953).toFixed(2)+' in':'--'}</span></div>
    <div class="row"><span>Visibility</span><span>${vi!=null?Math.round(vi*0.000621371)+' mi':'--'}</span></div>
    <div class="row"><span>Station</span><span>${o.sid}</span></div>`;
  }else{$('cur').textContent='Current observations are unavailable. Forecast shown on the next screens.'}
  $('upd').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
 }catch(e){
  $('cur').textContent='Could not load NOAA data ('+e.message+'). NOAA covers US locations only; the page refreshes automatically.';
 }
}
let rt;
function go(a,b){LOC=[a,b];snaps();try{localStorage.setItem('rw',JSON.stringify([a,b]))}catch(e){}clearInterval(rt);load(a,b);rt=setInterval(()=>load(a,b),600000)}
function saved(){try{const c=JSON.parse(localStorage.getItem('rw'));if(c){go(c[0],c[1]);return true}}catch(e){}return false}
function ask(msg){$('loc').textContent='Location needed';
 $('cur').innerHTML=msg+'<br><br><button id="lb" style="font:inherit;color:#0a1560;background:#ffd23a;border:0;padding:10px 16px;cursor:pointer;box-shadow:2px 2px 0 #000">Use my location</button><br><br>Or search a US city or ZIP in the bar below.';
 $('lb').onclick=locate}
function locate(){
 if(!window.isSecureContext||!navigator.geolocation){saved()||ask('Location needs a secure https page and a browser that supports it. Open the site from its https address.');return}
 $('cur').textContent='Finding your location… allow the browser prompt.';
 navigator.geolocation.getCurrentPosition(p=>go(p.coords.latitude,p.coords.longitude),e=>{
  if(saved())return;
  ask(e.code===1?'Location is blocked for this site. Click the lock icon in the address bar, set Location to Allow, then press the button. If the site is inside a preview frame, open its own web address instead.':'Could not get your location. Check that location services are on, then try again.')},{timeout:20000,maximumAge:600000})}
function start(){locate()}
$('sf').onsubmit=async e=>{e.preventDefault();const q=$('q').value.split(',')[0].trim();if(!q)return;$('cur').textContent='Searching…';if(/^\d{5}$/.test(q)){try{const z=await(await fetch('https://api.zippopotam.us/us/'+q)).json();return go(+z.places[0].latitude,+z.places[0].longitude)}catch(x){}}
 try{const r=await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&format=json&name='+encodeURIComponent(q))).json();
  if(!r.results)throw 0;go(r.results[0].latitude,r.results[0].longitude)}
 catch(x){$('cur').textContent='No match for "'+q+'". Try a US city name or ZIP code.'}};

/* ---------- Music: random mp3 from the repo's mp3/ folder ---------- */
let songs=[],last=-1,fails=0;const aud=$('aud'),isAudio=n=>/\.(mp3|m4a|ogg|wav)$/i.test(n),mk=(n,d='Mp3')=>({n:n.replace(/\.[^.]+$/,''),u:d+'/'+encodeURIComponent(n)});
async function loadSongs(){let why='';
 try{const r=await fetch('Mp3/playlist.json');if(r.ok){const j=await r.json();songs=j.map(x=>typeof x==='string'?x:x.name).filter(isAudio).map(n=>mk(n))}}catch(e){}
 if(!songs.length){try{const c=JSON.parse(localStorage.getItem('rwsongs3')||'null');if(c&&Date.now()-c.t<216e5)songs=c.s}catch(e){}}
 if(!songs.length){
  if(!/github\.io$/.test(location.hostname))why='not on github.io - add Mp3/playlist.json';
  else{const o=location.hostname.split('.')[0],p=location.pathname.split('/')[1],repo=p&&!/\.html?$/.test(p)?p:o+'.github.io';
   for(const d of ['Mp3','mp3','MP3','music','Music']){try{const r=await fetch('https://api.github.com/repos/'+o+'/'+repo+'/contents/'+d),j=await r.json();
     if(!r.ok){why=o+'/'+repo+'/'+d+' -> '+(j.message||r.status);continue}
     const l=j.filter(f=>f.type==='file'&&isAudio(f.name));
     if(l.length){songs=l.map(f=>mk(f.name,d));try{localStorage.setItem('rwsongs3',JSON.stringify({t:Date.now(),s:songs}))}catch(e){}break}why=d+'/ has no audio files'}catch(e){why='network error: '+e.message}}}}
 $('np').textContent=songs.length?songs.length+' songs ready':'No songs: '+why}
function pickSong(){if(!songs.length)return;let i;do{i=Math.floor(Math.random()*songs.length)}while(songs.length>1&&i===last);last=i;aud.src=songs[i].u;$('np').textContent='♪ '+songs[i].n;
 aud.play().then(()=>{$('play').textContent='❚❚'}).catch(()=>{$('np').textContent='♪ tap anywhere to start'})}
function firstTap(LP){const E=['pointerup','click','touchend','keydown'],go=e=>{E.forEach(t=>removeEventListener(t,go,true));if(e.target&&e.target.closest&&e.target.closest('.mus'))return;
 const run=()=>{if(!songs.length)return;if(!aud.src)pickSong();else if(aud.paused)aud.play().then(()=>{$('play').textContent='❚❚';if(songs[last])$('np').textContent='♪ '+songs[last].n}).catch(()=>{})};songs.length?run():LP.then(run)};
 E.forEach(t=>addEventListener(t,go,true))}
$('play').onclick=()=>{if(!aud.src)return pickSong();if(aud.paused){aud.play();$('play').textContent='❚❚'}else{aud.pause();$('play').textContent='♪'}};
$('rnd').onclick=pickSong;
aud.onplaying=()=>{fails=0};aud.onended=pickSong;
aud.onerror=()=>{if(++fails<4)setTimeout(pickSong,800);else $('np').textContent='Cannot play '+((songs[last]||{}).n||'song')+' (error '+(aud.error?aud.error.code:'?')+')'};
$('mute').onclick=()=>{aud.muted=!aud.muted;$('mute').textContent=aud.muted?'🔇':'🔈'};
$('vol').oninput=()=>{aud.volume=$('vol').value/100};aud.volume=.5;
const LP=loadSongs();LP.then(pickSong);firstTap(LP);
